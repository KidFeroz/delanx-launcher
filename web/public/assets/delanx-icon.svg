<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado Cyan Eléctrico (Lado Derecho / NX) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0077FE" />
    </linearGradient>

    <!-- Degradado Neón Rojo / Joy-Con (Lado Izquierdo / D) -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="100%" stop-color="#C4002F" />
    </linearGradient>

    <!-- Resplandor central -->
    <linearGradient id="coreWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Sombra sutil del isotipo -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Dark Tech con esquinas redondeadas -->
  <rect width="512" height="512" rx="112" fill="#0B0E14" />
  
  <!-- Borde sutil con textura tech -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1F2937" stroke-width="3" stroke-dasharray="16 8" opacity="0.6" />

  <!-- ISOTIPO CENTRAL (D + X Fusion & Launcher Core) -->
  <g transform="translate(0, 0)" filter="url(#dropShadow)">
    
    <!-- Ala Izquierda: Bloque D / Joy-Con Izquierdo (Rojo Neón) -->
    <path d="M 124 136
             C 124 118, 138 104, 156 104
             L 216 104
             C 264 104, 296 136, 296 184
             L 296 200
             L 236 256
             L 188 256
             L 188 168
             L 164 168
             L 164 344
             L 188 344
             L 236 344
             L 296 408
             L 156 408
             C 138 408, 124 394, 124 376
             Z"
          fill="url(#redGrad)" />

    <!-- Acento geométrico izquierdo (Puntos de anclaje Joy-Con) -->
    <circle cx="156" cy="144" r="10" fill="#FFFFFF" opacity="0.9" />

    <!-- Ala Derecha: Bloque X / Joy-Con Derecho (Cyan Eléctrico) -->
    <path d="M 356 104
             C 374 104, 388 118, 388 136
             L 388 376
             C 388 394, 374 408, 356 408
             L 296 408
             L 236 344
             L 284 344
             L 348 276
             L 348 236
             L 284 168
             L 236 168
             L 296 104
             Z"
          fill="url(#cyanGrad)" />

    <!-- Acento geométrico derecho (Botón Plus NX) -->
    <rect x="342" y="138" width="24" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="351" y="129" width="6" height="24" rx="3" fill="#FFFFFF" opacity="0.9" />

    <!-- Núcleo Central: Chevron / Play / Launch Gateway (Blanco Puro) -->
    <path d="M 236 196
             L 296 256
             L 236 316
             L 212 292
             L 248 256
             L 212 220
             Z"
          fill="url(#coreWhite)"
          filter="url(#neonGlow)" />
          
  </g>
</svg>
