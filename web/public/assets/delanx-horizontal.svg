<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0077FE" />
    </linearGradient>

    <linearGradient id="redGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="100%" stop-color="#C4002F" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Transparente o Contenedor Opcional -->
  <rect width="1000" height="260" rx="32" fill="#0B0E14" />
  <rect x="2" y="2" width="996" height="256" rx="30" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- ISOTIPO (Escalado y posicionado a la izquierda) -->
  <g transform="translate(60, 40) scale(0.35)">
    <!-- Bloque D Rojo -->
    <path d="M 124 136 C 124 118, 138 104, 156 104 L 216 104 C 264 104, 296 136, 296 184 L 296 200 L 236 256 L 188 256 L 188 168 L 164 168 L 164 344 L 188 344 L 236 344 L 296 408 L 156 408 C 138 408, 124 394, 124 376 Z" fill="url(#redGradH)" />
    <circle cx="156" cy="144" r="10" fill="#FFFFFF" opacity="0.9" />

    <!-- Bloque X Cyan -->
    <path d="M 356 104 C 374 104, 388 118, 388 136 L 388 376 C 388 394, 374 408, 356 408 L 296 408 L 236 344 L 284 344 L 348 276 L 348 236 L 284 168 L 236 168 L 296 104 Z" fill="url(#cyanGradH)" />
    <rect x="342" y="138" width="24" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="351" y="129" width="6" height="24" rx="3" fill="#FFFFFF" opacity="0.9" />

    <!-- Chevron Central -->
    <path d="M 236 196 L 296 256 L 236 316 L 212 292 L 248 256 L 212 220 Z" fill="#FFFFFF" filter="url(#glowH)" />
  </g>

  <!-- LOGOTIPO / TIPOGRAFÍA -->
  <g transform="translate(240, 145)">
    <!-- Texto Principal DELANX -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" letter-spacing="4" fill="url(#textGrad)">
      DELAN<tspan fill="url(#cyanGradH)">X</tspan>
    </text>

    <!-- Subtítulo Descriptor -->
    <text y="42" font-family="'JetBrains Mono', monospace, sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#64748B" text-transform="uppercase">
      HOMEBREW PORT &amp; DECOMP LAUNCHER
    </text>

    <!-- Tagline Plataforma con punto Joy-Con -->
    <g transform="translate(0, 68)">
      <circle cx="5" cy="-4" r="4" fill="#FF2A55" />
      <circle cx="19" cy="-4" r="4" fill="#00F5FF" />
      <text x="32" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#94A3B8">
        FOR NINTENDO SWITCH · HORIZON OS
      </text>
    </g>
  </g>
</svg>
