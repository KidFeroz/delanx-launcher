<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Degradados Principales -->
    <linearGradient id="cyanGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0077FE" />
    </linearGradient>

    <linearGradient id="redGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="100%" stop-color="#C4002F" />
    </linearGradient>

    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070a10" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <radialGradient id="redAmbient" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanAmbient" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filtro de sombra y resplandor -->
    <filter id="bigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Fondo Base y Luces Ambientales -->
  <rect width="1280" height="720" fill="url(#bgGlow)" />
  <rect width="1280" height="720" fill="url(#redAmbient)" />
  <rect width="1280" height="720" fill="url(#cyanAmbient)" />
  <rect width="1280" height="720" fill="url(#gridPattern)" />

  <!-- Marco Tecnológico -->
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <line x1="24" y1="60" x2="60" y2="24" stroke="#FF2A55" stroke-width="2" />
  <line x1="1220" y1="696" x2="1256" y2="660" stroke="#00F5FF" stroke-width="2" />

  <!-- CENTRO: ISOTIPO + LOGOTIPO COMPUESTO (16:9) -->
  <g transform="translate(640, 310)" text-anchor="middle">
    
    <!-- ISOTIPO CENTRAL -->
    <g transform="translate(-120, -170) scale(0.48)" filter="url(#bigShadow)">
      <!-- Bloque D Rojo -->
      <path d="M 124 136 C 124 118, 138 104, 156 104 L 216 104 C 264 104, 296 136, 296 184 L 296 200 L 236 256 L 188 256 L 188 168 L 164 168 L 164 344 L 188 344 L 236 344 L 296 408 L 156 408 C 138 408, 124 394, 124 376 Z" fill="url(#redGradB)" />
      <circle cx="156" cy="144" r="10" fill="#FFFFFF" opacity="0.9" />

      <!-- Bloque X Cyan -->
      <path d="M 356 104 C 374 104, 388 118, 388 136 L 388 376 C 388 394, 374 408, 356 408 L 296 408 L 236 344 L 284 344 L 348 276 L 348 236 L 284 168 L 236 168 L 296 104 Z" fill="url(#cyanGradB)" />
      <rect x="342" y="138" width="24" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
      <rect x="351" y="129" width="6" height="24" rx="3" fill="#FFFFFF" opacity="0.9" />

      <!-- Chevron Central -->
      <path d="M 236 196 L 296 256 L 236 316 L 212 292 L 248 256 L 212 220 Z" fill="#FFFFFF" />
    </g>

    <!-- TIPOGRAFÍA DELANX -->
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="92" font-weight="900" letter-spacing="8" fill="#FFFFFF">
      DELAN<tspan fill="url(#cyanGradB)">X</tspan>
    </text>

    <!-- SUBTÍTULO -->
    <text y="120" font-family="'JetBrains Mono', monospace, sans-serif" font-size="18" font-weight="600" letter-spacing="8" fill="#94A3B8" text-transform="uppercase">
      HOMEBREW PORT &amp; DECOMP LAUNCHER
    </text>

    <text y="152" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" font-weight="500" letter-spacing="4" fill="#64748B">
      NATIVE C++20 · NINTENDO SWITCH · HORIZON OS
    </text>
  </g>

  <!-- BADGES & FOOTER TECH EN ESQUINAS -->
  <!-- Esquina Superior Izquierda: Autor & Licencia -->
  <g transform="translate(60, 68)">
    <rect width="140" height="28" rx="6" fill="#1E293B" opacity="0.6" />
    <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#E2E8F0">BY KIDFEROZ</text>
    <rect x="150" width="110" height="28" rx="6" fill="#1E293B" opacity="0.6" />
    <text x="164" y="19" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00F5FF">GPLv3 FREE</text>
  </g>

  <!-- Esquina Superior Derecha: Status -->
  <g transform="translate(1080, 68)">
    <circle cx="10" cy="14" r="5" fill="#10B981" />
    <text x="24" y="19" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0">OPEN SOURCE</text>
  </g>

  <!-- Esquina Inferior: Tech Stack Markers -->
  <g transform="translate(60, 660)">
    <text font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569" letter-spacing="2">
      TARGET: LIBNX / AARCH64 · SDL2 · ZERO-COST ARTWORK ARCHITECTURE
    </text>
  </g>
</svg>
