<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Degradado Horizontal Spectrum Completo -->
    <linearGradient id="ultraBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="16%" stop-color="#00E5FF" />
      <stop offset="34%" stop-color="#2979FF" />
      <stop offset="52%" stop-color="#651FFF" />
      <stop offset="70%" stop-color="#FF1744" />
      <stop offset="86%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#FFAB00" />
    </linearGradient>

    <!-- Fondos con viñeta -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="ambientSpectrum" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#651FFF" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="ultraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Fondos -->
  <rect width="1280" height="720" fill="url(#vignette)" />
  <rect width="1280" height="720" fill="url(#ambientSpectrum)" />
  <rect width="1280" height="720" fill="url(#dotGrid)" />

  <!-- Borde técnico sutil con esquinas recortadas -->
  <rect x="32" y="32" width="1216" height="656" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <line x1="32" y1="72" x2="72" y2="32" stroke="#00E676" stroke-width="2.5" />
  <line x1="1208" y1="688" x2="1248" y2="648" stroke="#FFAB00" stroke-width="2.5" />

  <!-- BLOQUE CENTRAL ESTILO ULTRA: "powered by" + ISOTIPO + "delanx" -->
  <g transform="translate(640, 330)" text-anchor="middle" filter="url(#ultraShadow)">
    
    <!-- "powered by" / "homebrew launcher" -->
    <text y="-110" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="34" 
          font-style="italic" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#FFFFFF">
      powered by
    </text>

    <!-- GRUPO HORIZONTAL: ISOTIPO + WORDMARK -->
    <g transform="translate(-390, -40)">
      
      <!-- ISOTIPO VECTORIAL INCLINADO -->
      <g transform="translate(0, 10) skewX(-10) scale(0.48)">
        <!-- D -->
        <path d="M 124 136 C 124 118, 138 104, 156 104 L 216 104 C 264 104, 296 136, 296 184 L 296 200 L 236 256 L 188 256 L 188 168 L 164 168 L 164 344 L 188 344 L 236 344 L 296 408 L 156 408 C 138 408, 124 394, 124 376 Z" 
              fill="url(#ultraBannerGrad)" />
        <circle cx="156" cy="144" r="10" fill="#0B0E14" />
        <!-- X -->
        <path d="M 356 104 C 374 104, 388 118, 388 136 L 388 376 C 388 394, 374 408, 356 408 L 296 408 L 236 344 L 284 344 L 348 276 L 348 236 L 284 168 L 236 168 L 296 104 Z" 
              fill="url(#ultraBannerGrad)" />
        <rect x="342" y="138" width="24" height="6" rx="3" fill="#0B0E14" />
        <rect x="351" y="129" width="6" height="24" rx="3" fill="#0B0E14" />
        <!-- Chevron -->
        <path d="M 236 196 L 296 256 L 236 316 L 212 292 L 248 256 L 212 220 Z" fill="#FFFFFF" />
      </g>

      <!-- TEXTO "delanx" -->
      <g transform="translate(225, 115)">
        <text font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
              font-size="160" 
              font-weight="900" 
              font-style="italic" 
              letter-spacing="-4" 
              fill="url(#ultraBannerGrad)"
              text-anchor="start">
          delanx
        </text>
      </g>

    </g>

    <!-- SUBTÍTULO DESCRIPTIVO -->
    <text y="145" 
          font-family="'JetBrains Mono', monospace" 
          font-size="18" 
          font-weight="700" 
          letter-spacing="6" 
          fill="#94A3B8" 
          text-transform="uppercase">
      HOMEBREW PORT &amp; DECOMP LAUNCHER FOR NINTENDO SWITCH
    </text>

    <text y="178" 
          font-family="'JetBrains Mono', monospace" 
          font-size="13" 
          font-weight="500" 
          letter-spacing="3" 
          fill="#475569">
      NATIVE C++20 · ZERO-COST ARTWORK · GPLv3 FREE SOFTWARE
    </text>
  </g>

  <!-- BADGES TÉCNICOS EN FOOTER -->
  <g transform="translate(68, 640)">
    <text font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#E2E8F0">
      CREATED BY <tspan fill="#00E5FF">KIDFEROZ</tspan>
    </text>
  </g>
</svg>
